spin_manifest_version = 2

[application]
authors = ["Yordan Madzhunkov <yordan.madzhunkov@blocksense.network>"]
description = "A simple application that accepts image upload and infers imagenet from browser."
name = "spin-http-imagenet"
version = "1.0.0"

[[trigger.http]]
route = "/..."
component = "hello"


[component.hello]
source = "target/wasm32-wasi/release/http_rust_imagenet.wasm"
description = "A simple application that accepts image upload and infers imagenet from browser."
files = [{ source = ".spin", destination = "/" }]
key_value_stores = ["default"]
[component.hello.build]
command = "cargo build --target wasm32-wasi --release"
watch = ["src/**/*.rs", "Cargo.toml"]


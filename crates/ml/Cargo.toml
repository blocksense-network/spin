[package]
name = "spin-ml"

version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
tokio = "1.0"

spin-app = { path = "../app" }
spin-core = { path = "../core" }
spin-world = { path = "../world" }
table = { path = "../table" }

openvino = { workspace = true }
ort = { version = "2.0.0-rc.2", default-features = false, features = [
    "copy-dylibs",
    "download-binaries",
    "load-dynamic",
] }

curl = { version = "^0.4", features = ["rustls"] }
sha1 = "^0.10"
hex-literal = "^0.4"

tracing = { workspace = true }
